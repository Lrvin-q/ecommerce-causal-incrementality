[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-growth"
version = "0.1.0"
description = "电商营销策略的因果评估与增量利润优化（合成数据 / 已知 DGP）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "statsmodels",
    "econml",
    "lightgbm",
    "matplotlib",
    "seaborn",
    "pyarrow",
    "PyYAML",
    "tabulate",
    "tqdm",
    "joblib",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/conftest.py creates a fresh project-local directory for each invocation.
# A reused basetemp can inherit incompatible Windows sandbox permissions.
addopts = "-q --strict-markers -p no:cacheprovider"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
