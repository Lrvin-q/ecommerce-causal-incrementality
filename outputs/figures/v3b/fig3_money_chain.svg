   <g id="text_1">
    <text style="font-weight: 700; font-size: 9px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #263238" x="17.25696" y="18.8109" transform="rotate(-0 17.25696 18.8109)">(a) 首单、核销与复购</text>
   </g>
   <g id="text_2">
    <!-- 购物车金额 $V$ -->
    <g style="fill: #1e88e5" transform="translate(53.73834 60.515542)">
     <text>
