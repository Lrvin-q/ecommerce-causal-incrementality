      <tspan x="8.5" y="-0.875" style="font-weight: 700; font-size: 8.5px; font-family: 'Microsoft YaHei'; fill: #1e88e5">物</tspan>
      <tspan x="17" y="-0.875" style="font-weight: 700; font-size: 8.5px; font-family: 'Microsoft YaHei'; fill: #1e88e5">车</tspan>
      <tspan x="25.5" y="-0.875" style="font-weight: 700; font-size: 8.5px; font-family: 'Microsoft YaHei'; fill: #1e88e5">金</tspan>
      <tspan x="34" y="-0.875" style="font-weight: 700; font-size: 8.5px; font-family: 'Microsoft YaHei'; fill: #1e88e5">额</tspan>
      <tspan x="42.5" y="-0.875" style="font-weight: 700; font-size: 8.5px; font-family: 'Microsoft YaHei'; fill: #1e88e5"> </tspan>
      <tspan x="45.031738" y="-0.875" style="font-style: italic; font-size: 8.5px; font-family: 'STIXGeneral'; fill: #1e88e5">V</tspan>
     </text>
