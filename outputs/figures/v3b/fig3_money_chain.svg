    <text style="font-size: 7.3px; font-family: 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #263238" x="78.85584" y="82.322603" transform="rotate(-0 78.85584 82.322603)">首单金额不超过购物车</text>
   </g>
