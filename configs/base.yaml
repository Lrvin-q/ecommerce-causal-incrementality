# =============================================================================
# base.yaml —— 项目唯一参数来源
#
# 规则（见 AGENTS.md §3.2）：
#   1. 业务参数一律在这里，代码里不许出现业务 magic number。
#   2. 每个参数必须能回答"这个数从哪来"（方案附录 A.1：参数不是拍脑袋）。
#      注释里给出该参数的**业务对应量**或**可解释假设**。
#   3. 附录 A.1 的建议区间写在注释里；config.validate_config 会做软区间提示。
#   4. 标 【待校准】 的系数在 Round 1 有显式校准步骤，目标是命中方案给定的
#      ATE 水平（L1 ATE ≈ 0.05），而不是凭感觉填。
# =============================================================================

# -----------------------------------------------------------------------------
project:
  name: "电商营销策略的因果评估与增量利润优化"
  # 所有随机流的主种子。同一种子 + 同一配置 = 逐字节一致的结果。
  master_seed: 20240101
  # 诚实标注（AGENTS.md §6）：所有产物必须携带
  data_source_label: "合成数据 / 已知 DGP（非真实企业数据）"
  timezone: "Asia/Shanghai"

# -----------------------------------------------------------------------------
# 业务背景与利润参数
# 场景：某电商平台"加购未支付"用户首单转化率偏低，运营有固定营销预算，
#       需决策是否发券、发给谁、发多大面额。
# -----------------------------------------------------------------------------
business:
  # 平台新客占比（业务口径：注册 30 天内）—— 方案 A.1 建议 0.3
  new_user_share: 0.30

  # 加购未支付用户的历史首单转化率。
  # 业务来源：加购→支付漏斗的历史同期转化率，行业电商约 8%~12%。
  # 方案 A.1 建议 0.08~0.12；中值 0.10。
  baseline_conversion: 0.10

  # 券对转化率的最大提升（概率尺度的上限，不是平均效应 τ_max）。
  # 业务含义：最好的用户拿券后转化率最多提高 15 个百分点。
  # 硬约束：baseline_conversion + coupon_max_effect <= 1。
  coupon_max_effect: 0.15

  # 券面额分档（元）。业务来源：平台现行券档位 5/10/15/20 元。
  # 作用：策略优化除了"发给谁"还要决定"发多大面额"（面额 → 期望成本 c(X)）。
  coupon_face_values: [5, 10, 15, 20]

  # 面额 → 效应的饱和曲线尺度：
  #   g(f) = (1 - exp(-f/scale)) / (1 - exp(-f_max/scale)) ∈ (0, 1]
  # 业务含义：面额越大效果越强，但边际递减。
  # 依据：优惠券响应文献与平台历史 A/B 都显示 10→20 元的转化提升远小于 5→10 元。
  # 这个函数让"发多大面额"成为一个真实的最优化问题，而不是"越小越省"的废话。
  coupon_response_scale: 12.0

  # 参考面额：配置里所有 `target_ate` 都是指**该面额**下的效应目标。
  coupon_reference_face: 10.0

  # 券核销率。业务来源：同类券历史核销率，行业 40%~70%。
  # 为什么关键：期望核销成本 c(X) = 面额 × 核销概率，不是面额本身（方案 §2.4 主线四）。
  redemption_rate: 0.55

  # 退款率（护栏指标）。业务来源：该类目历史退款率，行业 5%~10%。
  # 注意：退款单必须留在样本里（GOAL.md R1），按实际退款核算利润。
  refund_rate: 0.075

  # 商品成本率（占支付收入）。业务来源：类目毛利率 25%~40% → 成本率 60%~75%。
  goods_cost_ratio: 0.68

  # 履约成本（元/单）：配送 + 仓储 + 包材。区间 3~8 元。
  # 为什么重要：履约成本**不可回收**，退款后仍然发生（方案 §2.3.3）。
  fulfill_cost_mean: 5.0
  fulfill_cost_sd: 1.2

  # 客单价（支付收入，元）。业务来源：加购未支付用户首单客单价分布。
  aov_mean: 120.0
  aov_sd: 35.0
  aov_min: 15.0

  # 退款后可回收的商品成本比例（1 - 损耗率）。
  # 为什么不是 1.0：生鲜/定制类目不可回收，方案 §2.3.3 明确要求保留不可回收部分。
  refundable_goods_ratio: 0.85

  # 退款手续费率（如支付通道费不退还）。
  refund_handling_fee_rate: 0.01

  # 券在订单退款后是否退还给用户。
  # false（业务常见）：券已核销不退回 → 券成本保留在 Π^net 里；true 则冲减。
  coupon_returned_on_refund: false

  # 用户特征分布（DGP 用）
  # 历史 GMV 必须分新老客两支：新客历史极短，与老客差一个数量级。
  # 若让新老客共用一个分布，"新客平均历史 GMV 788 元"这种数字面试时无法自圆其说。
  # 加权总体均值 ≈ 0.7×1100 + 0.3×60 = 788 元，与平台口径（约 800 元）一致。
  hist_gmv:
    returning_mean: 1100.0
    returning_sd: 700.0
    new_mean: 60.0
    new_sd: 90.0
  cart_value_mean: 130.0
  cart_value_sd: 60.0
  cart_value_min: 15.0
  # 浏览深度（7 天事件数）：负二项分布，均值 6、方差 9
  browse_depth_mean: 6.0
  browse_depth_var: 9.0
  # 渠道构成（业务来源：平台流量结构）。概率和为 1。
  channels:
    search: 0.35
    feed: 0.30
    xhs: 0.20
    other: 0.15

  # 行为日志单用户事件数上限（控制表规模）。
  # 注意：超过上限的用户，`browse_depth_7d` 仍记录**真实**的浏览深度，
  # 但 `user_events` 只保留前 N 条。因此 "browse_depth_7d == 事件计数"
  # 这条等式的成立范围是 depth <= cap，质量检查按此口径核对。
  user_events_cap: 20

  # 券使退款率**相对上升**的比例：券拉来的边际买家更可能反悔。
  # 7.5% × 1.03 = 7.725%，真实恶化 +0.225pp，落在 0.5pp 界值内但**不是零**。
  # 这正是"不显著 ≠ 安全"的教学点：对 0 做双侧检验大概率不显著，
  # 但单侧非劣效检验对预设界值能给出有意义的结论（方案 §2.4）。
  refund_rate_treated_multiplier: 1.03

# -----------------------------------------------------------------------------
# 两个窗口必须分开（GOAL.md R2 / 方案 §2.3.2）
# -----------------------------------------------------------------------------
windows:
  # 转化观察窗口：发券后多少天内判断是否下单
  convert_days: 7
  # 利润成熟窗口：覆盖支付、退款、成本结算周期
  # 必须 >= convert_days，否则转化用户没有足够时间成熟出利润
  profit_days: 30

# -----------------------------------------------------------------------------
# 随机实验设计（方案 §2.4 主线二）
# -----------------------------------------------------------------------------
experiment:
  alpha: 0.05
  power: 0.80
  # 1:1 分流
  treatment_share: 0.50

  # 最小可检测效应（MDE）。转化率与利润**分别**算样本量、取较大值（方案 §2.4）。
  mde:
    # 转化率绝对增量：1 个百分点。业务含义：0.10 → 0.11 是 10% 的相对提升，
    # 低于这个量级的提升不足以支撑一次改版与运营排期。
    conversion_abs: 0.01
    # 人均净增量贡献利润：0.5 元/人。
    # 依据：总预算 100,000 元 / 200,000 合格用户 = 0.5 元/人。
    # 低于此量级的增量利润不足以覆盖预算投入，因此 0.5 元/人是**盈亏平衡尺度**。
    profit_per_user: 0.50
    # 利润指标的标准差（元/人）= **实测值**，不是拍的：
    #   在 n=200,000 的 L1 总体上实测 sd(人均净贡献利润) = 10.79，
    #   其中 87.4% 的用户利润为 0（高度零膨胀）。
    # 真实业务中该值应来自历史 A/B 或用户级利润表的方差估计。
    # 敏感性：若真实方差是假设值的 k 倍，每组样本量需乘以 k²。
    profit_sd_assumed: 10.8

  # AA 校验：不看单次 AA 是否显著，看 1000 次重复的 p 值分布与假阳性率
  aa:
    repeats: 1000
    alpha: 0.05

  # 护栏非劣效检验（方案 §2.4）："不显著" ≠ "安全"，必须用单侧 CI 对预设界值判断
  guardrail:
    metric: refund_rate
    # 允许退款率恶化的最大幅度：0.5 个百分点
    noninferiority_margin: 0.005
    alpha_one_sided: 0.05

  # 多重比较（方案 §2.4）
  multiplicity:
    # bonferroni | holm | bh
    method: holm
    # 预注册的主指标；探索性切片不在此列，报告中标注"未校正"
    primary_metrics: ["net_profit_per_user", "conversion"]
    # 探索性切片：默认不校正，但报告必须标注
    exploratory_slices: []

# -----------------------------------------------------------------------------
# DGP 分层参数（方案 §3.3）
# 每一层只放松一个假设；每层必须能解析算出真值 ATE / CATE。
# -----------------------------------------------------------------------------
dgp:
  # 单次实验的用户规模。20 万量级可支撑 1pp MDE 且重复实验在可接受时间内。
  n_users: 200000

  # L0 理想基线：T ⟂ X，常数效应。作用是**校准评估流程**——这里不对，后面全不可信。
  # 直接给业务量，不给截距。
  l0:
    target_conversion: 0.10      # 自然转化率 p0
    target_ate_conversion: 0.05  # 券效应（常数），ATE = 0.05

  # L1 异质性：p0(X) = σ(βᵀX + β₀)，τ_Y(X) = scale(f) · σ(γᵀX + γ₀)
  #
  # 为什么配置里给"目标值"而不给截距：
  #   β₀ / γ₀ 由 dgp.calibrate 反解，使 E[p0(X)]、E[τ_Y(X)] **精确命中**业务目标。
  #   这样每个数字都能回答"从哪来"：
  #     0.10 = 加购未支付用户历史首单率（业务档位 8%~12% 的中值）
  #     0.05 = 运营对券提升转化的预期（5 个百分点）
  #     β 斜率 = "该特征每增加 1 个标准差，logit 变化多少"，方向来自业务常识
  #             （历史购买力越强 → 越可能转化）
  # 约束 p0(X) + τ_Y(X) ≤ 1（方案 §3.3 L1）由 dgp 层断言校验。
  l1:
    p0:
      target_mean: 0.10
      is_new: -0.10
      hist_gmv_z: 0.40
      cart_value_z: 0.35
      browse_depth_z: 0.25
      channel_search: 0.15
      channel_feed: 0.00
      channel_xhs: -0.10
    tau:
      # ATE 在**参考面额**（business.coupon_reference_face）下的目标值
      target_ate: 0.05
      # h(X) = σ(γᵀX + γ₀) 的总体均值，决定 τ 分布的"形状"（越接近 0.5 越平缓）
      h_target: 0.50
      is_new: 1.10          # 新客券效应显著更强 —— 异质性的业务机制
      hist_gmv_z: -0.40     # 老客历史购买力强，券的边际作用弱 → 利润侵蚀来源
      cart_value_z: 0.25
      browse_depth_z: 0.15
      channel_search: 0.10
      channel_feed: 0.00
      channel_xhs: 0.20

  # L2 实验约束：有限样本、处理比例 ≠ 0.5、效应时间漂移、护栏指标
  l2:
    n_users: 60000
    treatment_share: 0.30
    # 三周效应漂移（概率尺度绝对增量）；真值 = 各期加权平均
    weekly_effect: [0.08, 0.05, 0.03]
    # 各周样本占比（业务来源：活动节奏，首周曝光最集中）
    weekly_share: [0.45, 0.35, 0.20]
    # L2 复用 L1 的异质性形状，只把 ATE 按周缩放；h_target 控制 τ 分布形状
    h_target: 0.50
    p0_target_mean: 0.10

  # L3 选择偏差：T ~ Bernoulli(σ(αᵀX + α₀ + λU))，p0(X,U) = σ(βᵀX + β₀ + λU)
  # U = 未观测混淆（如线下客服私下推荐），同时影响发券与购买。
  # 可观测部分复用 l1 的 β / γ，于是 L1→L3 是"只拆掉可忽略性"的干净对照。
  l3:
    alpha_x:
      is_new: 0.30
      hist_gmv_z: 0.50
      cart_value_z: 0.40
      browse_depth_z: 0.30
      channel_search: 0.10
      channel_feed: 0.00
      channel_xhs: 0.30
    # α₀ 由校准反解，使 λ=0 时发券比例命中该目标（观察性研究里约一半被"挑中"）
    target_treatment_share: 0.50
    # p0 / τ 的形状复用 l1；U 的边际分布为 Logistic(0, 1)（标准化）
    p0_target_mean: 0.10
    tau_target_ate: 0.05
    h_target: 0.50
    # 混淆强度扫描网格；方案给 {0, 0.5, 1.0}，更细网格用于定位失效阈值
    lambda_grid: [0.0, 0.25, 0.5, 0.75, 1.0, 1.25, 1.5]
    # 方案要求的三个点必须出现在任何汇总表里
    lambda_required: [0.0, 0.5, 1.0]

  # L4 时间趋势 / DID（有条件才做，见 GOAL.md 第五部分）
  l4:
    enabled: false
    # 概率尺度平行趋势参数（方案 §3.3 L4）
    p_i0_min: 0.05
    p_i0_max: 0.15
    delta_1: [0.02, 0.05]
    tau: [0.02, 0.08]
    periods: 2
    # true = 平行趋势成立；false = 处理组有额外时间趋势（DID 系统性有偏）
    parallel_trend_holds: true

# -----------------------------------------------------------------------------
# 脏数据层（方案 §3.5）：展示清洗能力，同时制造非随机缺失
# -----------------------------------------------------------------------------
dirty:
  enabled: true
  # cart_value 非随机缺失：缺失概率与渠道相关（不同渠道埋点质量不同）
  cart_value_missing_rate: 0.05
  cart_value_missing_by_channel:
    search: 0.02
    feed: 0.04
    xhs: 0.12
    other: 0.08

  # 刷单用户：hist_gmv 极端值
  fraud_user_rate: 0.002
  fraud_gmv_multiplier: 60.0

  # 同一曝光多次上报（需去重）
  duplicate_event_rate: 0.03
  # 事件上报延迟的最大小时数（需按事件时间而非入库时间统计）
  event_delay_max_hours: 48

  # 注：方案 §3.5 的"隐性选择偏差（发券规则里藏未观测变量 U）"**不在本段实现**，
  # 而由 `dgp.l3` + `dgp.assign_observational` 的 λ 控制（见 dgp.l3 段）。
  # 这里刻意不放一个没人消费的开关——死配置比缺配置更误导人。

# -----------------------------------------------------------------------------
# 预算约束与策略优化（方案 §2.4 主线四）
# -----------------------------------------------------------------------------
budget:
  # 营销总预算（元）。按 20 万用户、人均期望成本约 2.5 元、投放约 20% 用户估算。
  total: 100000.0
  # 预算口径（方案 §2.4 明确要求写清）：
  #   expected         —— 约束 E[π(X)c(X)] <= B，c(X) 为期望核销成本，保证的是**预期**预算
  #   hard_cap         —— 企业要求实际支出硬上限，需按核销率分位数预留缓冲
  basis: expected
  # hard_cap 口径下的缓冲：用核销率的 90 分位数估算成本
  hard_cap_buffer_quantile: 0.90

  # 0-1 背包 DP 的规模控制（方案 §2.4）
  knapsack:
    # 先按 τ̂/ĉ 比值排序取前 N 人进背包
    prefilter_top_n: 5000
    # 成本离散化桶宽（元）；与 prefilter 二选一或叠加
    cost_bucket_width: 0.5

  # 预算敏感性扫描
  scan:
    n_points: 9
    min_ratio: 0.2   # 相对基准预算的倍数
    max_ratio: 3.0

# -----------------------------------------------------------------------------
# 评估（方案 §2.4 主线五）
# -----------------------------------------------------------------------------
evaluation:
  # 训练/验证/测试分离（按用户切，禁止泄漏）
  test_size: 0.30
  val_size: 0.20

  # 重复实验次数。正式数值 200~500；调试可用 20，但报告必须用正式值并注明。
  repeats_r: 200

  # 排序指标：估计 top-k 与真实 top-k 的重合度
  top_share: 0.20

  # 三层验证的通过标准（方案 §2.4）
  acceptance:
    mc_ate_tol: 0.001
    coverage_range: [0.93, 0.97]
    fpr_target: 0.05
    fpr_tolerance: 0.015

  # 业务合理性扫描：各参数 ±20% 一维扰动
  robustness_perturbation: 0.20
  robustness_params:
    - business.baseline_conversion
    - business.coupon_face_values
    - business.redemption_rate
    - business.refund_rate

# -----------------------------------------------------------------------------
# 因果估计器超参（Round 2）
# -----------------------------------------------------------------------------
estimators:
  cate:
    # 训练/验证/测试分离后，在验证集上选模型
    base_learner: lightgbm
    lightgbm_params:
      n_estimators: 300
      learning_rate: 0.05
      num_leaves: 31
      min_child_samples: 40
      subsample: 0.8
      colsample_bytree: 0.8
    causal_forest_params:
      n_estimators: 500
      min_samples_leaf: 40
      max_depth: null
      cv: 5
  obs:
    # 倾向得分模型
    propensity: logistic
    # PSM 匹配
    psm_caliper: 0.02
    # IPW 权重截断分位（防止极端权重）
    ipw_weight_clip_quantile: 0.99

# -----------------------------------------------------------------------------
# 记录与日志
# -----------------------------------------------------------------------------
logging:
  level: INFO
  # 是否把每次运行的配置快照 + 环境信息写进 outputs/runs/<run_id>/meta.json
  write_run_meta: true
